{% if profile_name_form %}
<form id="display-name-form" class="profile-name-form">
    <label for="display-name">Display name</label>
    <div class="profile-name-field">
        <input id="display-name" name="displayName" type="text" placeholder="Choose your name" autocomplete="nickname" required>
        <button type="submit">Save</button>
    </div>
    <p role="status"></p>
</form>
{% else %}
<form id="display-name-form" style="margin-bottom: 16px;">
    <label for="display-name" style="display: block; margin-bottom: 8px;">Display name</label>
    <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;">
        <input id="display-name" name="displayName" type="text" required
               style="min-width: 0; max-width: 100%; box-sizing: border-box; padding: 8px; border-radius: 5px; border: 0;">
        <button type="submit" class="btn btn-blue" style="padding: 8px 14px;">Save name</button>
    </div>
    <p role="status" style="margin: 6px 0 0; font-size: 0.85rem;"></p>
</form>
{% endif %}
