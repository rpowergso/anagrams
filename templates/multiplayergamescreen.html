{% extends "layout.html" %}
{% block content %}

<!-- Pass variables from Flask to JS -->
<script>
    const ROOM_ID = "{{ room_id }}";
    const INITIAL_BOT_DIFFICULTY = "{{ initial_bot_difficulty }}";
</script>

<!-- 1. THE LOBBY (Shown by default) -->
<div id="lobby-container" class="lobby-shell" style="max-width: 600px; margin: 40px auto; padding: 30px; background: var(--board-color); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;">
    <h1 style="margin-bottom: 10px; letter-spacing: 2px;">GAME LOBBY</h1>
    <p id="lobby-mode-label" style="margin: -2px 0 18px; color: #b7c7d6;">MULTIPLAYER / BOT</p>
    <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; font-family: monospace; font-size: 1.5rem; color: #3498db; margin-bottom: 25px;">
        CODE: <span style="color: white; font-weight: bold;">{{ room_id }}</span>
    </div>

    <!-- HOST ONLY SETTINGS -->
    <div id="host-controls" class="lobby-settings-card" style="display: none; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px dashed rgba(255,255,255,0.2);">
        <h3 style="margin-top: 0; font-size: 0.9rem; color: #f1c40f;">HOST SETTINGS 👑</h3>
        <div class="lobby-settings-grid" style="display: flex; justify-content: space-around; gap: 15px; flex-wrap: wrap;">
            <div class="lobby-setting" style="flex: 1;">
                <label for="setting-preset" style="display: block; font-size: 0.8rem; margin-bottom: 5px;">TILE SET</label>
                <select id="setting-preset" onchange="applyTilePreset()"
                        style="width: 90%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
                    <option value="standard">STANDARD (60)</option>
                    <option value="bananagrams">BANANAGRAMS (144)</option>
                    <option value="custom">CUSTOM</option>
                </select>
            </div>
            <div class="lobby-setting" style="flex: 1;">
                <label for="setting-tiles" style="display: block; font-size: 0.8rem; margin-bottom: 5px;">TOTAL TILES</label>
                <input type="number" id="setting-tiles" value="60" min="20" max="144" onchange="useCustomTileCount()"
                       style="width: 80%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
            </div>
            <div class="lobby-setting" style="flex: 1;">
                <label for="setting-autodraw" style="display: block; font-size: 0.8rem; margin-bottom: 5px;">AUTO-DRAW</label>
                <select id="setting-autodraw" onchange="updateSettings()"
                        style="width: 90%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
                    <option value="true">ON</option>
                    <option value="false">OFF</option>
                </select>
            </div>
            <div class="lobby-setting" style="flex: 1;">
                <label style="display: block; font-size: 0.8rem; margin-bottom: 5px;">DRAW TIMER (S)</label>
                <input type="number" id="setting-timer" value="20" min="3" max="60" onchange="updateSettings()"
                       style="width: 80%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
            </div>
            <div class="lobby-setting" style="flex: 1;">
                <label for="setting-penalty" style="display: block; font-size: 0.8rem; margin-bottom: 5px;">MISTAKE SILENCE</label>
                <select id="setting-penalty" onchange="updateSettings()"
                        style="width: 80%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
                    <option value="true">YES</option>
                    <option value="false">NO</option>
                </select>
            </div>
            <div class="lobby-setting" style="flex: 1;">
                <label for="setting-winner-draws" style="display: block; font-size: 0.8rem; margin-bottom: 5px;">WORD WINNER DRAWS NEXT</label>
                <select id="setting-winner-draws" onchange="updateSettings()"
                        style="width: 80%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
                    <option value="false">NO</option>
                    <option value="true">YES</option>
                </select>
            </div>
            <div class="lobby-setting" style="flex: 1;">
                <label for="setting-prefire" style="display: block; font-size: 0.8rem; margin-bottom: 5px;">TAB PREFIRE</label>
                <select id="setting-prefire" onchange="updateSettings()"
                        style="width: 80%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
                    <option value="false">OFF</option>
                    <option value="true">ON</option>
                </select>
            </div>
            <div class="lobby-setting" style="flex: 1;">
                <label for="setting-paste" style="display: block; font-size: 0.8rem; margin-bottom: 5px;">COPY / PASTE</label>
                <select id="setting-paste" onchange="updateSettings()"
                        style="width: 80%; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold;">
                    <option value="true">ALLOWED</option>
                    <option value="false">BLOCKED</option>
                </select>
            </div>
        </div>
    </div>

    <!-- PLAYER LIST -->
    <div class="lobby-roster" style="text-align: left; margin-bottom: 30px;">
        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;">
            <h3 style="font-size: 1rem; opacity: 0.7;">PLAYERS &amp; BOTS</h3>
            <button id="add-bot-btn" type="button" class="btn btn-toggle" onclick="addBot()" style="display: none; padding: 8px 12px; font-size: .75rem;">+ ADD BOT</button>
        </div>
        <div id="player-list">
            <!-- Players injected via JS -->
            <p style="text-align: center; opacity: 0.5;">Connecting...</p>
        </div>
    </div>

    <div class="lobby-actions" style="display: flex; gap: 15px; justify-content: center;">
        <button class="btn btn-leave" onclick="confirmLeaveGame()" style="padding: 12px 25px;">LEAVE</button>
        <button id="ready-btn" class="btn btn-blue" onclick="toggleReady()" style="padding: 12px 40px;">READY UP</button>
        <button id="start-btn" class="btn btn-green" onclick="startGame()" style="display: none; padding: 12px 40px;">START GAME</button>
    </div>
</div>

<!-- 2. THE GAME CONTAINER (Hidden by default) -->
<div id="game-container" style="display: none;">
    <!-- Top Nav -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(0,0,0,0.3);">
        <button class="btn btn-leave" onclick="confirmLeaveGame()">LEAVE</button>
        
        <div style="text-align: center;">
            <div id="turn-indicator" style="font-weight: bold; font-size: 1.1rem; letter-spacing: 1px;">WAITING...</div>
            <div id="draw-timer-wrap" style="font-size: 0.8rem; opacity: 0.8;">AUTO-DRAW IN: <span id="draw-timer" style="color: #e74c3c; font-weight: bold; font-size: 1.1rem;">-</span>s</div>
        </div>

        <div class="game-top-actions">
            <button id="topReplayButton" class="btn btn-green" type="button" onclick="requestReplay()" hidden>PLAY AGAIN</button>
            <div id="tileCountDisplay" style="font-weight: bold;">
                Tiles: <span id="tileCount">--</span>
            </div>
        </div>
    </div>

    <!-- Drawing Area -->
    <div style="text-align: center; padding: 20px;">
        <div id="tilePool" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; min-height: 80px; margin-bottom: 20px;"></div>
        <button class="btn btn-blue" id="drawButton" onclick="drawTile()" style="padding: 15px 50px; font-size: 1.2rem;" disabled>DRAW TILE</button>
        <button class="btn btn-green" id="endGameButton" onclick="requestEndGame()" style="padding: 15px 50px; font-size: 1.2rem; display: none; margin-left: 15px;">END GAME</button>
    </div>

    <!-- Players Board -->
    <div id="playersBoard" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; padding: 20px 40px; padding-bottom: 120px;">
        <!-- Player word cards injected here -->
    </div>

    <!-- Input Footer -->
    <div style="position: fixed; bottom: 0; width: 100%; background: #1a252f; padding: 20px; display: flex; justify-content: center; gap: 15px; z-index: 1000; border-top: 2px solid rgba(255,255,255,0.1);">
        <div style="position: relative;">
            <div id="standbyWordDisplay" class="standby-word" hidden></div>
            <input type="text" id="wordInput" maxlength="30" placeholder="Type word..."
                   style="padding: 15px; border-radius: 30px; width: 400px; border: 3px solid transparent; font-size: 1.2rem; outline: none; background: #2c3e50; color: white;"
                   autocomplete="off">
            <div id="statusMessage" style="position: absolute; top: -25px; left: 20px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>
        <button class="btn btn-green" onclick="submitWord()" style="padding: 0 30px; border-radius: 30px;">SUBMIT</button>
    </div>
</div>

<div id="board-definition-modal" class="definition-modal" hidden>
    <div class="definition-card" role="dialog" aria-modal="true" aria-labelledby="board-definition-title">
        <button type="button" class="definition-close" onclick="closeBoardWordDefinition()" aria-label="Close word details">&times;</button>
        <h2 id="board-definition-title"></h2>
        <div class="word-details-grid">
            <section class="word-details-panel">
                <h3>DEFINITION</h3>
                <div id="board-definition-body" aria-live="polite"></div>
                <p class="definition-credit">Definitions powered by Datamuse.</p>
            </section>
            <section id="board-steals-panel" class="word-details-panel word-steals-panel">
                <h3>WAYS TO STEAL IT</h3>
                <div id="board-steals-body" aria-live="polite"></div>
            </section>
        </div>
    </div>
</div>

<!-- Libraries -->
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/multiplayer.js') }}"></script>

<style>
    #lobby-container.lobby-shell {
        width: min(820px, calc(100% - 32px));
        max-width: 820px !important;
        box-sizing: border-box;
    }

    .lobby-settings-grid {
        display: grid !important;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px !important;
    }

    .lobby-setting {
        min-width: 0;
        padding: 12px;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 10px;
        background: rgba(0,0,0,.14);
        text-align: left;
    }

    .lobby-setting label {
        display: flex !important;
        align-items: flex-end;
        min-height: 2.1em;
        line-height: 1.05;
    }

    #host-controls .lobby-setting input,
    #host-controls .lobby-setting select {
        width: 100% !important;
        min-width: 0;
        height: 38px;
        box-sizing: border-box;
    }

    .lobby-actions { flex-wrap: wrap; }

    .standby-word {
        position: absolute;
        left: 18px;
        bottom: calc(100% + 28px);
        max-width: min(360px, 75vw);
        padding: 7px 11px;
        overflow: hidden;
        border: 1px solid rgba(241,196,15,.7);
        border-radius: 8px;
        background: rgba(44,62,80,.97);
        color: #f1c40f;
        font-size: .78rem;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .standby-word[hidden] { display: none; }

    /* Styling for the Lobby Player List */
    .lobby-player-item {
        transition: transform 0.2s;
        border-left: 5px solid transparent;
    }
    .lobby-player-item:hover {
        transform: translateX(5px);
    }

    .lobby-row-controls { display: flex; align-items: center; gap: 7px; }
    .lobby-row-controls select {
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        font-size: .72rem;
        font-weight: 800;
    }
    .lobby-remove {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid rgba(231,76,60,.65);
        border-radius: 7px;
        background: rgba(231,76,60,.13);
        color: #ffb5ae;
        cursor: pointer;
        font-weight: 900;
    }
    .lobby-remove[data-kick-player] { width: auto; padding: 0 8px; font-size: .64rem; }

    /* Input styling for Host Settings */
    #host-controls input {
        background: #2c3e50;
        color: white;
        border: 1px solid rgba(255,255,255,0.2);
    }
    
    /* Simple Animation for the Drawing Timer */
    #draw-timer {
        transition: all 0.3s;
    }

    #drawButton:disabled {
        background: #7f8c8d !important; /* Grey color */
        box-shadow: none !important;
        transform: none !important;
        filter: grayscale(1);
        border: 2px solid rgba(0,0,0,0.2);
    }

    #drawButton {
        transition: all 0.3s ease;
    }

    .game-top-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        min-width: 130px;
    }

    #topReplayButton[hidden] { display: none; }

    /* Keep word tiles looking consistent */
    .word-block {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        background: rgba(0,0,0,0.2);
        padding: 6px;
        border-radius: 8px;
    }

    .board-word-button {
        border: 0;
        color: inherit;
        cursor: pointer;
        font: inherit;
    }

    .board-word-button:hover, .board-word-button:focus-visible {
        outline: 2px solid #f3e5ab;
        outline-offset: 3px;
    }

    .definition-modal {
        position: fixed;
        inset: 0;
        z-index: 6000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0,0,0,.78);
    }

    .definition-modal[hidden] { display: none; }
    .definition-card {
        position: relative;
        width: min(1000px, 92vw);
        max-height: 82vh;
        overflow-y: auto;
        padding: 28px;
        border: 2px solid rgba(243,229,171,.5);
        border-radius: 15px;
        background: #1a252f;
        box-shadow: 0 15px 45px rgba(0,0,0,.5);
    }
    .definition-card.definition-only { width: min(560px, 92vw); }
    .definition-card.definition-only .word-details-grid { grid-template-columns: 1fr; }
    .word-steals-panel[hidden] { display: none; }
    .definition-card h2 { margin-top: 0; color: var(--tile-bg); letter-spacing: 2px; }
    .definition-card li { margin-bottom: 10px; line-height: 1.5; }
    .word-details-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
    }
    .word-details-panel {
        min-width: 0;
        padding: 18px;
        border-radius: 12px;
        background: rgba(0,0,0,.2);
    }
    .word-details-panel h3 {
        margin: 0 0 18px;
        color: #f3e5ab;
        letter-spacing: 1px;
    }
    .steal-group + .steal-group { margin-top: 20px; }
    .steal-group h4 { margin: 0 0 10px; color: #2ecc71; }
    .steal-words { display: flex; flex-wrap: wrap; gap: 8px; }
    .steal-word {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 5px;
        border-radius: 8px;
        background: rgba(255,255,255,.06);
    }
    .steal-word .added {
        background: #2ecc71;
        color: #102b1b;
        box-shadow: 0 2px 0 #1d9b50;
    }
    .steal-empty { margin: 0; opacity: .65; }
    .steal-overflow { margin: 8px 0 0; font-size: .78rem; opacity: .65; }
    .definition-close {
        position: absolute;
        top: 10px;
        right: 14px;
        border: 0;
        background: transparent;
        color: white;
        cursor: pointer;
        font-size: 2rem;
    }
    .definition-credit { margin-bottom: 0; color: #bbb; font-size: .8rem; }

    @media (max-width: 700px) {
        #lobby-container.lobby-shell {
            width: min(100% - 20px, 820px);
            margin: 20px auto !important;
            padding: 20px !important;
        }
        .lobby-settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .word-details-grid { grid-template-columns: 1fr; }
        .game-top-actions { min-width: 0; }
        #topReplayButton { padding: 9px 12px; font-size: .75rem; }
    }

    @media (max-width: 460px) {
        .lobby-settings-grid { grid-template-columns: 1fr; }
        .lobby-actions .btn { flex: 1 1 130px; }
    }
</style>

{% endblock %}
