{% extends "layout.html" %}
{% block content %}
<main class="ranked-shell">
 <nav class="ranked-nav"><a href="/homepage">← HOME</a><span>RANKED PUZZLES</span></nav>
 <section class="match-layout">
  <div class="player-row opponent-row"><div class="avatar opponent-avatar">P</div><div class="player-copy"><strong>PUZZLE MASTER</strong><span>Board rating <b id="puzzleRating">—</b></span></div><div class="match-chip" id="legalCount">Loading…</div></div>
  <div class="board-stage"><div id="rankedStatus" class="board-status">Preparing the board…</div><div id="rankedBoard" class="ranked-board"></div><div class="pool-tray"><span class="pool-label">POOL</span><div id="rankedPool" class="ranked-pool"></div><span class="flip-key"><i></i> NEW</span></div></div>
  <div class="player-row you-row"><div class="avatar you-avatar">Y</div><div class="player-copy"><strong>YOU</strong><span id="rankedStats"></span></div><div class="elo-badge"><small>ELO</small><strong id="rankedElo">1000</strong></div></div>
 </section>
 <section class="action-panel"><form id="rankedForm"><input id="rankedInput" autocomplete="off" placeholder="Find a word or steal…"><button class="btn btn-green">PLAY WORD</button><button id="rankedGiveUp" class="btn btn-leave" type="button">GIVE UP</button></form><div id="rankedResult"></div><div id="rankedAnswers" class="ranked-answers"></div><button id="rankedNext" class="btn btn-blue" type="button" hidden>NEXT PUZZLE</button></section>
</main>
<script src="/static/js/ranked.js?v=three-strikes-2"></script>
<style>
.ranked-shell{max-width:1180px;margin:auto;padding:18px 24px 55px}.ranked-nav{display:flex;justify-content:space-between;padding:8px 2px 18px;font-weight:800;letter-spacing:2px}.ranked-nav a{color:#b9c8d6;text-decoration:none}.match-layout{filter:drop-shadow(0 16px 25px rgba(0,0,0,.3))}.player-row{display:flex;align-items:center;gap:14px;padding:13px 18px;background:#233547}.opponent-row{border-radius:14px 14px 0 0}.you-row{border-radius:0 0 14px 14px}.avatar{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-size:1.35rem;font-weight:900}.opponent-avatar{background:#e67e22}.you-avatar{background:#3498db}.player-copy{display:flex;flex-direction:column;gap:4px}.player-copy span{font-size:.82rem;color:#aebdca}.match-chip,.elo-badge{margin-left:auto;background:#182736;border-radius:9px;padding:9px 14px}.elo-badge{display:flex;align-items:center;gap:9px}.elo-badge small{color:#8fa5b8}.elo-badge strong{font-size:1.35rem;color:#f3e5ab}.board-stage{position:relative;min-height:380px;padding:50px 34px 35px;background:radial-gradient(circle at 50% 30%,#47627a,#30475c 70%);border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(0,0,0,.3)}.board-status{position:absolute;top:15px;left:0;right:0;text-align:center;color:#b9c8d6;font-size:.82rem;letter-spacing:1px}.ranked-board{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:30px 42px;min-height:190px}.ranked-word{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}.ranked-word .tile{width:42px;height:46px;font-size:1.45rem;flex:0 0 auto}.pool-tray{display:flex;align-items:center;justify-content:center;gap:16px;margin:34px auto 0;padding:13px 20px;width:fit-content;max-width:90%;background:#1d2e3e;border-radius:12px;box-shadow:inset 0 2px 7px rgba(0,0,0,.45)}.pool-label{font-size:.72rem;font-weight:900;color:#8fa5b8;letter-spacing:2px}.ranked-pool{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.ranked-pool .pool-tile{width:54px;height:58px;font-size:1.8rem}.ranked-pool .flipped{background:#9b59b6;color:white;box-shadow:0 4px 0 #6c3483}.flip-key{font-size:.7rem;font-weight:800;color:#c8b3d0}.flip-key i{display:inline-block;width:9px;height:9px;background:#9b59b6;border-radius:2px}.action-panel{margin:18px auto 0;max-width:850px;text-align:center}#rankedForm{display:flex;justify-content:center;gap:10px;padding:13px;background:#233547;border-radius:14px;box-shadow:0 8px 18px rgba(0,0,0,.22)}#rankedInput{flex:1;min-width:0;padding:15px 20px;border:2px solid transparent;border-radius:9px;text-transform:uppercase;font-size:1.05rem}#rankedInput:focus{outline:none;border-color:#3498db}#rankedResult{min-height:30px;margin:18px;font-weight:bold}.ranked-answers{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px}.ranked-answer{padding:8px 12px;border-radius:9px;background:rgba(0,0,0,.22)}.ranked-answer.found{background:#27ae60}@media(max-width:650px){.board-stage{padding:48px 12px 25px}.ranked-board{gap:20px 15px}.ranked-word .tile{width:34px;height:39px;font-size:1.2rem}.pool-tray{gap:8px;padding:10px}.pool-label,.flip-key{display:none}#rankedForm{flex-wrap:wrap}#rankedInput{flex-basis:100%}}
</style>
{% endblock %}
